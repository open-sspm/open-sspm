nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/open-sspm/open-sspm
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

database:
  existingSecret:
    name: ""
    key: DATABASE_URL

connectorSecret:
  existingSecret:
    name: ""
    key: CONNECTOR_SECRET_KEY

smtp:
  enabled: false
  host: ""
  port: 587
  tlsMode: "starttls"
  fromAddress: ""
  fromName: ""
  existingSecret:
    name: ""
    usernameKey: SMTP_USERNAME
    passwordKey: SMTP_PASSWORD

config:
  httpAddr: ":8080"
  # Metrics listener (set to "off" to disable).
  # Default binds to localhost for safety; set to ":9090" to bind 0.0.0.0 inside the pod (scrapable via Pod IP).
  # If you enable metrics scraping (e.g. `metrics.service.enabled=true`), restrict access via NetworkPolicy / mTLS; metrics may include sensitive identifiers.
  metricsAddr: "127.0.0.1:9090"
  # Structured logs for service/ops commands.
  logFormat: "json"
  logLevel: "info"
  # When true, session & CSRF cookies are marked Secure (required for HTTPS ingress).
  # Keep false for plain HTTP / port-forward.
  authCookieSecure: false
  # Dev-only convenience: seeds admin@admin.com / admin if no auth_users exist.
  devSeedAdmin: false
  resyncEnabled: true
  syncFullEnabled: true
  # Enables the discovery lane system-wide. When false, api does not queue
  # discovery work and discovery worker Deployments are omitted.
  syncDiscoveryEnabled: true
  # Enables event inbox receivers and the worker Deployment.
  eventInboxEnabled: true
  syncInterval: 15m
  syncDiscoveryInterval: 15m
  syncTailInterval: 5m
  # Optional per-connector full-sync interval. Empty means use syncInterval cadence.
  syncOktaInterval: ""
  syncEntraInterval: ""
  syncGoogleWorkspaceInterval: ""
  syncGithubInterval: ""
  syncDatadogInterval: ""
  syncAwsInterval: ""
  syncFailureBackoffMax: ""
  syncOktaWorkers: 3
  syncGithubWorkers: 6
  syncDatadogWorkers: 3
  # Event partitions are maintained by worker processes. Retention is enforced
  # by dropping daily events/event_targets partitions older than eventRetentionDays.
  eventPartitionMaintenanceInterval: 12h
  eventPartitionFutureDays: 7
  eventRetentionDays: 90
  eventInbox:
    batchSize: 500
    pollInterval: 5s
    cleanupInterval: 1h
    retryDelay: 30s
    retryMaxDelay: 15m
    staleProcessingTimeout: 5m
    maxAttempts: 10
    processedRetentionDays: 30
    deadLetterRetentionDays: 90
  eventEvaluatorWorker:
    pollInterval: 5s
    batchSize: 100
    maxAttempts: 10

metrics:
  port: 9090
  service:
    enabled: false
    port: 9090
    # Which deployment component to expose metrics for: api or worker.
    component: worker
    # Optional worker lane selector: full, discovery, event-inbox, tail, or evaluator.
    # Empty selects every worker lane.
    workerLane: ""
    annotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: open-sspm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# API deployment settings.
api: {}

worker:
  lanes:
    full:
      enabled: true
      replicaCount: 1
      podAnnotations: {}
      podLabels: {}
      extraEnv: []
      extraEnvFrom: []
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    discovery:
      enabled: true
      replicaCount: 1
      podAnnotations: {}
      podLabels: {}
      extraEnv: []
      extraEnvFrom: []
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    eventInbox:
      enabled: true
      replicaCount: 1
      podAnnotations: {}
      podLabels: {}
      extraEnv: []
      extraEnvFrom: []
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    tail:
      enabled: true
      replicaCount: 1
      podAnnotations: {}
      podLabels: {}
      extraEnv: []
      extraEnvFrom: []
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    evaluator:
      enabled: true
      replicaCount: 1
      podAnnotations: {}
      podLabels: {}
      extraEnv: []
      extraEnvFrom: []
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

migrations:
  enabled: true
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}

seedRules:
  enabled: true
  onUpgrade: false
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}

# Optionally bootstrap the first admin user via a Helm hook Job.
# Credentials are read from an existing Kubernetes Secret (do not put passwords in Helm values).
bootstrapAdmin:
  enabled: false
  onUpgrade: false
  existingSecret:
    name: ""
    emailKey: ADMIN_EMAIL
    passwordKey: ADMIN_PASSWORD
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}
