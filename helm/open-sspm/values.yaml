nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/open-sspm/open-sspm
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

database:
  existingSecret:
    name: ""
    key: DATABASE_URL

connectorSecret:
  existingSecret:
    name: ""
    key: CONNECTOR_SECRET_KEY

redis:
  existingSecret:
    name: ""
    urlKey: REDIS_URL

smtp:
  enabled: false
  host: ""
  port: 587
  tlsMode: "starttls"
  fromAddress: ""
  fromName: ""
  existingSecret:
    name: ""
    usernameKey: SMTP_USERNAME
    passwordKey: SMTP_PASSWORD

config:
  httpAddr: ":8080"
  # Metrics listener (set to "off" to disable).
  # Default binds to localhost for safety; set to ":9090" to bind 0.0.0.0 inside the pod (scrapable via Pod IP).
  # If you enable metrics scraping (e.g. `metrics.service.enabled=true`), restrict access via NetworkPolicy / mTLS; metrics may include sensitive identifiers.
  metricsAddr: "127.0.0.1:9090"
  # Structured logs for service/ops commands.
  logFormat: "json"
  logLevel: "info"
  # When true, session & CSRF cookies are marked Secure (required for HTTPS ingress).
  # Keep false for plain HTTP / port-forward.
  authCookieSecure: false
  # Dev-only convenience: seeds admin@admin.com / admin if no auth_users exist.
  devSeedAdmin: false
  resyncEnabled: true
  # Queue backend for push ingest dispatch. Postgres remains the durable ledger.
  # Set to "redis" to enqueue persisted push inbox row IDs through Redis.
  queueBackend: postgres
  # Plain-value convenience for REDIS_URL. Prefer redis.existingSecret for credentials.
  redisUrl: ""
  redisKeyPrefix: open-sspm
  # Enables the discovery lane system-wide. When false, api does not queue
  # discovery work and discovery/ingest worker Deployments are omitted.
  syncDiscoveryEnabled: true
  syncInterval: 15m
  syncDiscoveryInterval: 15m
  # Optional per-connector full-sync interval. Empty means use syncInterval cadence.
  syncGoogleWorkspaceInterval: ""
  syncOktaWorkers: 3
  syncGithubWorkers: 6
  syncDatadogWorkers: 3

metrics:
  port: 9090
  service:
    enabled: false
    port: 9090
    # Which component to expose metrics for: api, worker, worker-discovery, or worker-ingest.
    component: worker
    annotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: open-sspm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Preferred API deployment settings for new installs. When unset, the chart
# falls back to the deprecated serve.* block below for upgrade compatibility.
api: {}

# Deprecated alias for API deployment settings. Use api.* for new values files.
serve:
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

discoveryWorker:
  enabled: true
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingestWorker:
  enabled: true
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}

seedRules:
  enabled: true
  onUpgrade: false
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}

# Optionally bootstrap the first admin user via a Helm hook Job.
# Credentials are read from an existing Kubernetes Secret (do not put passwords in Helm values).
bootstrapAdmin:
  enabled: false
  onUpgrade: false
  existingSecret:
    name: ""
    emailKey: ADMIN_EMAIL
    passwordKey: ADMIN_PASSWORD
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    resources: {}
