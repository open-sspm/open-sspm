{{- define "open-sspm.workerLaneDeployment" -}}
{{- $root := .root -}}
{{- $lane := .lane -}}
{{- $laneValues := .values }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worker-lane-%s" (include "open-sspm.fullname" $root) $lane | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "open-sspm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    open-sspm.io/worker-lane: {{ $lane }}
spec:
  replicas: {{ $laneValues.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-sspm.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: worker
      open-sspm.io/worker-lane: {{ $lane }}
  template:
    metadata:
      {{- with $laneValues.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-sspm.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: worker
        open-sspm.io/worker-lane: {{ $lane }}
        {{- with $laneValues.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "open-sspm.serviceAccountName" $root }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: open-sspm
          image: "{{ $root.Values.image.repository }}:{{ default $root.Chart.AppVersion $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - worker
            - --lane={{ $lane }}
          ports:
            - name: metrics
              containerPort: {{ $root.Values.metrics.port }}
              protocol: TCP
          {{- include "open-sspm.workerProbes" $root | nindent 10 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret.name is required" $root.Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.key is required" $root.Values.database.existingSecret.key }}
            {{- if $root.Values.connectorSecret.existingSecret.name }}
            - name: CONNECTOR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.connectorSecret.existingSecret.name }}
                  key: {{ $root.Values.connectorSecret.existingSecret.key | quote }}
            {{- end }}
            {{- if or (eq $lane "full") (eq $lane "discovery") }}
            - name: HTTP_ADDR
              value: {{ $root.Values.config.httpAddr | quote }}
            {{- end }}
            - name: METRICS_ADDR
              value: {{ $root.Values.config.metricsAddr | quote }}
            - name: LOG_FORMAT
              value: {{ $root.Values.config.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ $root.Values.config.logLevel | quote }}
            {{- if or (eq $lane "full") (eq $lane "discovery") }}
            - name: AUTH_COOKIE_SECURE
              value: {{ ternary "1" "0" $root.Values.config.authCookieSecure | quote }}
            - name: DEV_SEED_ADMIN
              value: {{ ternary "1" "0" $root.Values.config.devSeedAdmin | quote }}
            - name: RESYNC_ENABLED
              value: {{ ternary "1" "0" $root.Values.config.resyncEnabled | quote }}
            {{- end }}
            {{- if or (eq $lane "full") (eq $lane "discovery") (eq $lane "event-inbox") }}
            - name: SYNC_DISCOVERY_ENABLED
              value: {{ ternary "1" "0" (and $root.Values.config.syncDiscoveryEnabled $root.Values.worker.lanes.discovery.enabled) | quote }}
            {{- end }}
            {{- if eq $lane "full" }}
            {{- include "open-sspm.fullSyncEnv" $root | nindent 12 }}
            - name: SYNC_DISCOVERY_INTERVAL
              value: {{ $root.Values.config.syncDiscoveryInterval | quote }}
            - name: SYNC_OKTA_WORKERS
              value: {{ $root.Values.config.syncOktaWorkers | quote }}
            - name: SYNC_GITHUB_WORKERS
              value: {{ $root.Values.config.syncGithubWorkers | quote }}
            - name: SYNC_DATADOG_WORKERS
              value: {{ $root.Values.config.syncDatadogWorkers | quote }}
            {{- else if eq $lane "discovery" }}
            - name: SYNC_DISCOVERY_INTERVAL
              value: {{ $root.Values.config.syncDiscoveryInterval | quote }}
            {{- if $root.Values.config.syncFailureBackoffMax }}
            - name: SYNC_FAILURE_BACKOFF_MAX
              value: {{ $root.Values.config.syncFailureBackoffMax | quote }}
            {{- end }}
            - name: SYNC_OKTA_WORKERS
              value: {{ $root.Values.config.syncOktaWorkers | quote }}
            - name: SYNC_GITHUB_WORKERS
              value: {{ $root.Values.config.syncGithubWorkers | quote }}
            - name: SYNC_DATADOG_WORKERS
              value: {{ $root.Values.config.syncDatadogWorkers | quote }}
            {{- else if eq $lane "event-inbox" }}
            {{- include "open-sspm.eventInboxEnv" $root | nindent 12 }}
            {{- else if eq $lane "tail" }}
            {{- include "open-sspm.tailSyncEnv" $root | nindent 12 }}
            {{- if $root.Values.config.syncFailureBackoffMax }}
            - name: SYNC_FAILURE_BACKOFF_MAX
              value: {{ $root.Values.config.syncFailureBackoffMax | quote }}
            {{- end }}
            {{- else if eq $lane "evaluator" }}
            {{- include "open-sspm.eventEvaluatorWorkerEnv" $root | nindent 12 }}
            {{- end }}
            {{- include "open-sspm.eventPartitionEnv" $root | nindent 12 }}
            {{- include "open-sspm.smtpEnv" $root | nindent 12 }}
            {{- with $laneValues.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $laneValues.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $laneValues.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $laneValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $laneValues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $laneValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- $root := . -}}
{{- $lanes := .Values.worker.lanes -}}
{{- $eventInboxEnabled := eq (include "open-sspm.eventInboxEnabled" .) "1" -}}
{{- if and .Values.config.syncFullEnabled $lanes.full.enabled }}
{{- include "open-sspm.workerLaneDeployment" (dict "root" $root "lane" "full" "values" $lanes.full) }}
{{- end }}
{{- if and .Values.config.syncDiscoveryEnabled $lanes.discovery.enabled }}
{{- include "open-sspm.workerLaneDeployment" (dict "root" $root "lane" "discovery" "values" $lanes.discovery) }}
{{- end }}
{{- if and $eventInboxEnabled $lanes.eventInbox.enabled }}
{{- include "open-sspm.workerLaneDeployment" (dict "root" $root "lane" "event-inbox" "values" $lanes.eventInbox) }}
{{- end }}
{{- if $lanes.tail.enabled }}
{{- include "open-sspm.workerLaneDeployment" (dict "root" $root "lane" "tail" "values" $lanes.tail) }}
{{- end }}
{{- if $lanes.evaluator.enabled }}
{{- include "open-sspm.workerLaneDeployment" (dict "root" $root "lane" "evaluator" "values" $lanes.evaluator) }}
{{- end }}
