{{- $api := .Values.api | default dict -}}
{{- $replicaCount := 1 -}}
{{- $podAnnotations := dict -}}
{{- $podLabels := dict -}}
{{- $extraEnv := list -}}
{{- $extraEnvFrom := list -}}
{{- $resources := dict -}}
{{- $nodeSelector := dict -}}
{{- $tolerations := list -}}
{{- $affinity := dict -}}
{{- if hasKey $api "replicaCount" }}{{- $replicaCount = $api.replicaCount }}{{- end -}}
{{- if hasKey $api "podAnnotations" }}{{- $podAnnotations = $api.podAnnotations }}{{- end -}}
{{- if hasKey $api "podLabels" }}{{- $podLabels = $api.podLabels }}{{- end -}}
{{- if hasKey $api "extraEnv" }}{{- $extraEnv = $api.extraEnv }}{{- end -}}
{{- if hasKey $api "extraEnvFrom" }}{{- $extraEnvFrom = $api.extraEnvFrom }}{{- end -}}
{{- if hasKey $api "resources" }}{{- $resources = $api.resources }}{{- end -}}
{{- if hasKey $api "nodeSelector" }}{{- $nodeSelector = $api.nodeSelector }}{{- end -}}
{{- if hasKey $api "tolerations" }}{{- $tolerations = $api.tolerations }}{{- end -}}
{{- if hasKey $api "affinity" }}{{- $affinity = $api.affinity }}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-api" (include "open-sspm.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "open-sspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      {{- include "open-sspm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-sspm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "open-sspm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: open-sspm
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret.name is required" .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.key is required" .Values.database.existingSecret.key }}
            {{- if .Values.connectorSecret.existingSecret.name }}
            - name: CONNECTOR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.connectorSecret.existingSecret.name }}
                  key: {{ .Values.connectorSecret.existingSecret.key | quote }}
            {{- end }}
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: METRICS_ADDR
              value: {{ .Values.config.metricsAddr | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ ternary "1" "0" .Values.config.authCookieSecure | quote }}
            - name: DEV_SEED_ADMIN
              value: {{ ternary "1" "0" .Values.config.devSeedAdmin | quote }}
            - name: RESYNC_ENABLED
              value: {{ ternary "1" "0" .Values.config.resyncEnabled | quote }}
            - name: SYNC_DISCOVERY_ENABLED
              value: {{ ternary "1" "0" (and .Values.config.syncDiscoveryEnabled .Values.worker.lanes.discovery.enabled) | quote }}
            {{- include "open-sspm.fullSyncEnv" . | nindent 12 }}
            - name: SYNC_DISCOVERY_INTERVAL
              value: {{ .Values.config.syncDiscoveryInterval | quote }}
            {{- include "open-sspm.eventInboxEnv" . | nindent 12 }}
            - name: SYNC_OKTA_WORKERS
              value: {{ .Values.config.syncOktaWorkers | quote }}
            - name: SYNC_GITHUB_WORKERS
              value: {{ .Values.config.syncGithubWorkers | quote }}
            - name: SYNC_DATADOG_WORKERS
              value: {{ .Values.config.syncDatadogWorkers | quote }}
            {{- include "open-sspm.smtpEnv" . | nindent 12 }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
