{{- if .Values.tailWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worker-tail" (include "open-sspm.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "open-sspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-tail
spec:
  replicas: {{ .Values.tailWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-sspm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-tail
  template:
    metadata:
      {{- with .Values.tailWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-sspm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-tail
        {{- with .Values.tailWorker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "open-sspm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: open-sspm
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker-tail
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- include "open-sspm.workerProbes" . | nindent 10 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret.name is required" .Values.database.existingSecret.name }}
                  key: {{ required "database.existingSecret.key is required" .Values.database.existingSecret.key }}
            {{- if .Values.connectorSecret.existingSecret.name }}
            - name: CONNECTOR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.connectorSecret.existingSecret.name }}
                  key: {{ .Values.connectorSecret.existingSecret.key | quote }}
            {{- end }}
            - name: METRICS_ADDR
              value: {{ .Values.config.metricsAddr | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- include "open-sspm.tailSyncEnv" . | nindent 12 }}
            {{- if .Values.config.syncFailureBackoffMax }}
            - name: SYNC_FAILURE_BACKOFF_MAX
              value: {{ .Values.config.syncFailureBackoffMax | quote }}
            {{- end }}
            {{- include "open-sspm.eventPartitionEnv" . | nindent 12 }}
            {{- include "open-sspm.smtpEnv" . | nindent 12 }}
            {{- with .Values.tailWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.tailWorker.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tailWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.tailWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tailWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tailWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
