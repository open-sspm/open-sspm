---
- name: Deploy Open-SSPM runtime assets
  hosts: demo
  become: true

  vars:
    opensspm_repo_root: "{{ playbook_dir }}/../../.."
    opensspm_static_src: "{{ opensspm_repo_root }}/web/static"
    opensspm_static_dest: /opt/open-sspm/web/static
    opensspm_migrations_src: "{{ opensspm_repo_root }}/db/migrations"
    opensspm_migrations_dest: /opt/open-sspm/db/migrations

  pre_tasks:
    - name: Verify built CSS exists on control machine
      delegate_to: localhost
      run_once: true
      ansible.builtin.stat:
        path: "{{ opensspm_static_src }}/app.css"
      register: app_css

    - name: Fail if CSS is missing
      delegate_to: localhost
      run_once: true
      ansible.builtin.fail:
        msg: "web/static/app.css not found. Run `just ui` (or `npm run build:css`) before deploying."
      when: not app_css.stat.exists

  tasks:
    - name: Check runtime env file exists
      ansible.builtin.stat:
        path: /etc/open-sspm.env
      register: opensspm_env_file

    - name: Fail if runtime env file is missing
      ansible.builtin.fail:
        msg: "/etc/open-sspm.env is missing. Run site.yml first so the demo server has its baseline runtime config."
      when: not opensspm_env_file.stat.exists

    - name: Ensure demo runtime env defaults are present
      ansible.builtin.lineinfile:
        path: /etc/open-sspm.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: "STATIC_DIR", value: "/opt/open-sspm/web/static" }
        - { key: "CONNECTOR_SECRET_KEY", value: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" }
        - { key: "LOG_FORMAT", value: "json" }
        - { key: "LOG_LEVEL", value: "info" }
        - { key: "SYNC_INTERVAL", value: "0s" }
        - { key: "SYNC_DISCOVERY_INTERVAL", value: "0s" }
        - { key: "RESYNC_ENABLED", value: "0" }

    - name: Stop open-sspm services before deployment
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
      loop:
        - open-sspm
        - open-sspm-worker
        - open-sspm-discovery-worker
        - open-sspm-ingest-worker
      failed_when: false

    - name: Reset static assets directory
      ansible.builtin.file:
        path: "{{ opensspm_static_dest }}"
        state: absent

    - name: Recreate static assets directory
      ansible.builtin.file:
        path: "{{ opensspm_static_dest }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Reset migrations directory
      ansible.builtin.file:
        path: "{{ opensspm_migrations_dest }}"
        state: absent

    - name: Recreate migrations directory
      ansible.builtin.file:
        path: "{{ opensspm_migrations_dest }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy static assets
      ansible.builtin.copy:
        src: "{{ opensspm_static_src }}/"
        dest: "{{ opensspm_static_dest }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      register: static_copy

    - name: Copy migrations
      ansible.builtin.copy:
        src: "{{ opensspm_migrations_src }}/"
        dest: "{{ opensspm_migrations_dest }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      register: migrations_copy

    - name: Restart open-sspm service
      ansible.builtin.service:
        name: open-sspm
        state: restarted
      when: static_copy.changed or migrations_copy.changed
